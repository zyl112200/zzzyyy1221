server:
  port: 8080
  # 绑定所有网卡：局域网内任何设备都能通过 http://192.168.68.9:8080 访问后端
  address: 0.0.0.0

spring:
  application:
    name: spongebob-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库同样指向本机局域网 IP，局域网内其它机器起后端也能共用同一份数据
    url: ${MYSQL_URL:jdbc:mysql://192.168.68.9:3306/spongebob_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.bikinibottom: debug
