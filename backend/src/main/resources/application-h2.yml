# ============================================================
# 本地启动专用 profile（无需安装 MySQL）
# 使用 H2 内存数据库，兼容 MySQL 语法。
# 激活方式：java -jar xxx.jar --spring.profiles.active=h2
#          或 mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # NON_KEYWORDS=USER：避免 H2 把表名 user 当作保留字
    url: jdbc:h2:mem:spongebob_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.bikinibottom: debug
